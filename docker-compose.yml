services:
  mysql:
    image: mysql:8.0
    container_name: ingeniocare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ingenio
      MYSQL_DATABASE: ingeniocare
      MYSQL_USER: ingenio
      MYSQL_PASSWORD: ingenio
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
