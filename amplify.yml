version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - |
          set -e
          echo "Backend deploy context: AWS_BRANCH=${AWS_BRANCH:-} AWS_APP_ID=${AWS_APP_ID:-} AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}"
          if [ -z "${AWS_BRANCH:-}" ] || [ -z "${AWS_APP_ID:-}" ]; then
            echo "ERROR: AWS_BRANCH and AWS_APP_ID are required for ampx pipeline-deploy."
            exit 1
          fi
          aws cloudformation describe-stacks --stack-name CDKToolkit --region "$AWS_DEFAULT_REGION" > /dev/null 2>&1 \
            || (ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text) \
              && npx cdk bootstrap "aws://${ACCOUNT_ID}/${AWS_DEFAULT_REGION}")
          npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --debug
frontend:
  phases:
    preBuild:
      commands:
        - test -d node_modules || npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
customRules:
  - source: </^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|webp|xml)$)([^.]+$)/>
    status: "200"
    target: /index.html
